name: 말씀 메뉴 자동 갱신 (유튜브 영상·게시물)

on:
  schedule:
    - cron: "17 * * * *"   # 1시간마다 (매시 17분)
  workflow_dispatch: {}      # Actions 탭에서 'Run workflow'로 바로 실행

permissions:
  contents: write

concurrency:
  group: update-word
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 유튜브 영상·큐티, 카페 말씀기도캘리 가져오기
        run: python3 tools/update_word.py
      - name: 바뀐 것이 있으면 저장
        if: always()
        run: |
          git config user.name "midbar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add word.json qt.json cali.json cali
          if git diff --cached --quiet; then
            echo "바뀐 내용 없음"
          else
            git commit -m "말씀 메뉴 자동 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git pull --rebase
            git push
          fi
